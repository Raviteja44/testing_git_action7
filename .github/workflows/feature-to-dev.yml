name: "1. Deploy Feature to Dev"

on:
  push:
    branches: 
      - '**'
  workflow_dispatch:
    inputs:
      feature_branch:
        description: 'Your feature branch name'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for deployment'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-dev-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine feature branch
        id: determine-branch
        run: |
          # For push events, use the current branch
          if [ "${{ github.event_name }}" == "push" ]; then
            FEATURE_BRANCH="${GITHUB_REF#refs/heads/}"
            echo "Push event - using current branch: $FEATURE_BRANCH"
          else
            FEATURE_BRANCH="${{ github.event.inputs.feature_branch }}"
            echo "Manual trigger - using input branch: $FEATURE_BRANCH"
          fi
          
          echo "feature_branch=$FEATURE_BRANCH" >> $GITHUB_OUTPUT
          echo "FEATURE_BRANCH=$FEATURE_BRANCH" >> $GITHUB_ENV

      - name: Validate feature branch
        run: |
          FEATURE_BRANCH="${{ steps.determine-branch.outputs.feature_branch }}"
          echo "Validating feature branch: $FEATURE_BRANCH"
          
          # Check if branch exists
          if ! git show-ref --verify --quiet refs/remotes/origin/$FEATURE_BRANCH 2>/dev/null; then
            echo "❌ Error: Branch '$FEATURE_BRANCH' does not exist"
            exit 1
          fi
          
          echo "✅ Feature branch validated"

      - name: Get feature branch commits
        id: get-commits
        run: |
          FEATURE_BRANCH="${{ steps.determine-branch.outputs.feature_branch }}"
          git fetch origin $FEATURE_BRANCH
          git fetch origin dev
          
          # Get commits that are only in feature branch
          COMMITS=$(git log origin/dev..origin/$FEATURE_BRANCH --oneline --reverse 2>/dev/null | head -20)
          COMMIT_COUNT=$(git rev-list --count origin/dev..origin/$FEATURE_BRANCH 2>/dev/null || echo "0")
          LATEST_COMMIT=$(git rev-parse origin/$FEATURE_BRANCH)
          
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "latest_commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT
          
          echo "📋 Your commits to deploy:"
          echo "$COMMITS"

      - name: Create PR to Dev
        uses: actions/github-script@v7
        env:
          FEATURE_BRANCH: ${{ steps.determine-branch.outputs.feature_branch }}
          DEPLOYMENT_REASON: ${{ github.event.inputs.deployment_reason }}
        with:
          script: |
            const featureBranch = process.env.FEATURE_BRANCH;
            const deploymentReason = process.env.DEPLOYMENT_REASON || 'Automated deployment';
            const latestCommit = '${{ steps.get-commits.outputs.latest_commit }}';
            const commitCount = '${{ steps.get-commits.outputs.commit_count }}';
            const commits = `${{ steps.get-commits.outputs.commits }}`;
            
            // Store commit info in PR description for later use
            const prBody = `
            ## 🚀 Deployment to DEV Environment
            **Feature Branch:** ${featureBranch}
            **Latest Commit:** ${latestCommit}
            **Deployment Reason:** ${deploymentReason}
            
            **Commit SHA:** \`${latestCommit}\`
            **Feature Branch:** \`${featureBranch}\`
            
            **Save this information for UAT promotion.**
            
            **Approval Required:** Please review and approve.
            `;
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔵 DEV: Deploy ${featureBranch}`,
              body: prBody,
              head: featureBranch,
              base: 'dev'
            });
            
            console.log(`✅ Created DEV deployment PR: ${pr.html_url}`);
            console.log(`💡 COMMIT SHA: ${latestCommit}`);
            console.log(`💡 FEATURE BRANCH: ${featureBranch}`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['dev-deployment', `feature-${featureBranch.replace(/\//g, '-')}`]
            });