name: "3. Deploy to Production"

on:
  workflow_dispatch:
    inputs:
      uat_pr_number:
        description: 'UAT PR number that was merged'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for production deployment'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-prod-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info from UAT PR
        id: get-pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ github.event.inputs.uat_pr_number }}';
            
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              // Extract commit SHA and feature branch from PR body
              const body = pr.body;
              const commitMatch = body.match(/\*\*Commit SHA:\*\* \`([a-f0-9]+)\`/);
              const branchMatch = body.match(/\*\*Feature Branch:\*\* \`([^\`]+)\`/);
              
              if (!commitMatch || !branchMatch) {
                throw new Error('Could not find commit SHA or feature branch in PR description');
              }
              
              const commitSha = commitMatch[1];
              const featureBranch = branchMatch[1];
              
              console.log(`✅ Found UAT PR info:`);
              console.log(`   Feature Branch: ${featureBranch}`);
              console.log(`   Commit SHA: ${commitSha}`);
              
              // Set outputs
              core.setOutput('commit_sha', commitSha);
              core.setOutput('feature_branch', featureBranch);
              core.setOutput('pr_title', pr.title);
              
            } catch (error) {
              console.error('❌ Error getting PR info:', error);
              throw new Error(`Failed to get UAT PR #${prNumber}. Make sure it exists and contains commit info.`);
            }

      - name: Validate commit
        id: validate-commit
        run: |
          COMMIT_SHA="${{ steps.get-pr-info.outputs.commit_sha }}"
          FEATURE_BRANCH="${{ steps.get-pr-info.outputs.feature_branch }}"
          
          echo "Validating commit: $COMMIT_SHA from $FEATURE_BRANCH"
          
          # Verify commit exists and is in uat
          git fetch origin uat
          if ! git merge-base --is-ancestor $COMMIT_SHA origin/uat 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA is not in uat branch"
            echo "💡 Make sure this commit was promoted to UAT first"
            exit 1
          fi
          
          echo "✅ Commit validated"

      - name: Create Production PR
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = '${{ steps.get-pr-info.outputs.commit_sha }}';
            const featureBranch = '${{ steps.get-pr-info.outputs.feature_branch }}';
            const deploymentReason = '${{ github.event.inputs.deployment_reason }}';
            
            // Create production branch
            const prodBranch = `prod-${featureBranch.replace(/\//g, '-')}-${Date.now()}`;
            
            // Get current prod
            const { data: prodRef } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'prod'
            });
            
            // Create branch from prod
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${prodBranch}`,
              sha: prodRef.commit.sha
            });
            
            // Merge the specific commit
            await github.rest.repos.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: prodBranch,
              head: commitSha
            });
            
            const prBody = `
            ## 🟢 Production Deployment
            **Feature Branch:** ${featureBranch}
            **Commit SHA:** ${commitSha}
            **Deployment Reason:** ${deploymentReason}
            
            **Verification Status:**
            ✅ Tested in DEV Environment
            ✅ Verified in UAT Environment
            ✅ Ready for Production
            
            **Approval Required:** Manager/Director approval required.
            `;
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🟢 PROD: Deploy ${featureBranch}`,
              body: prBody,
              head: prodBranch,
              base: 'prod'
            });
            
            console.log(`✅ Created Production deployment PR: ${pr.html_url}`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['production']
            });