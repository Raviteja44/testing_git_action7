name: Cleanup on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Delete temporary branch if it exists
        uses: actions/github-script@v7
        with:
          script: |
            const headBranch = '${{ github.event.pull_request.head.ref }}';
            
            // Only delete temporary promotion branches
            if (headBranch.startsWith('uat-') || headBranch.startsWith('prod-') || headBranch.startsWith('promote/')) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${headBranch}`
                });
                console.log(`✅ Deleted temporary branch: ${headBranch}`);
              } catch (error) {
                console.log(`ℹ️ Branch ${headBranch} might already be deleted: ${error.message}`);
              }
            } else {
              console.log(`ℹ️ Skipping deletion of non-temporary branch: ${headBranch}`);
            }